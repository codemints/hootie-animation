      <div class="animation-wrapper" data-animation-object="hootie">
        <div class="animation-boundary-box">
          <div class="animation-item-wrapper animation-oscillate" data-animation-item="group">
            <div class="animation-item-wrapper animation-item-wrapper-static" data-animation-item="body">
              <img src="/hootie-part-body.png" alt="hootie-part-body" />
            </div>
    
            <div class="animation-item-wrapper animation-rotate-step" data-animation-item="left-horn">
              <img src="/hootie-part-left-horn.png" alt="hootie-part-left-horn" />
            </div>
    
            <div class="animation-item-wrapper animation-rotate-step" data-animation-item="right-horn">
              <img src="/hootie-part-right-horn.png" alt="hootie-part-right-horn" />
            </div>
    
            <div class="animation-item-wrapper animation-rotate-from-to" data-animation-item="left-wing">
              <img src="/hootie-part-left-wing.png" alt="hootie-part-left-wing" />
            </div>
    
            <div class="animation-item-wrapper animation-rotate-from-to" data-animation-item="right-wing">
              <img src="/hootie-part-right-wing.png" alt="hootie-part-right-wing" />
            </div>
    
            <div class="animation-item-wrapper animation-rotate-from-to" data-animation-item="tail">
              <img src="/hootie-part-tail.png" alt="hootie-part-tail" />
            </div>
          </div>
        </div>
      </div>

    <div class="animation-controls">
      <div class="animation-controls-title">
        <h2>Welcome to <span class="rotate-text">Hootie's</span> World</h2>
        <p>Hootie is a friendly ghost who loves to fly through the clouds and play with his friends. Use the buttons below to make Hootie fly.</p>
      </div>

      <div class="animation-controls-buttons">
        <button class="play-button" type="button">Play</button>
        <button class="pause-button" type="button">Pause</button>
        <button class="reset-button" type="button">Reset</button>
      </div>

      <div class="hootie-illustration">
        <img src="/hootie-comps_Walking.png" alt="hootie-illustration" />
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
